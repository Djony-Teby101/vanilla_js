<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application de Recensement - MVP</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Application de Recensement</h1>
        <h2>Architecture MVP</h2>
        
        <!-- Formulaire d'ajout -->
        <div class="form-container">
            <h3>Ajouter une personne</h3>
            <form id="personForm">
                <div class="form-group">
                    <label for="nom">Nom:</label>
                    <input type="text" id="nom" required>
                </div>
                <div class="form-group">
                    <label for="prenom">Prénom:</label>
                    <input type="text" id="prenom" required>
                </div>
                <div class="form-group">
                    <label for="age">Âge:</label>
                    <input type="number" id="age" required min="0" max="150">
                </div>
                <div class="form-group">
                    <label for="ville">Ville:</label>
                    <input type="text" id="ville" required>
                </div>
                <button type="submit">Ajouter</button>
            </form>
        </div>

        <!-- Statistiques -->
        <div class="stats-container">
            <h3>Statistiques</h3>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Total personnes:</span>
                    <span id="totalCount" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Âge moyen:</span>
                    <span id="averageAge" class="stat-value">0</span>
                </div>
            </div>
        </div>

        <!-- Liste des personnes -->
        <div class="list-container">
            <h3>Liste des personnes</h3>
            <div id="personList" class="person-list">
                <!-- La liste sera générée dynamiquement -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/model.js"></script>
    <script src="js/view.js"></script>
    <script src="js/presenter.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
